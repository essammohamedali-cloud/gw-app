.top-btn span{font-size:8.5px;font-weight:700}

 dialog{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;max-width:100%;height:100%;max-height:100%;margin:0;padding:0;border-radius:0;z-index:99999}
 dialog::backdrop{background:rgba(0,0,0,.65)}

let pdfLibP=null;
function loadPdfLib(){
 if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(true);
 if(pdfLibP)return pdfLibP;
 const srcs=['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://fastly.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://gcore.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://testingcf.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://cdn.staticfile.org/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdn.bootcdn.net/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
 pdfLibP=new Promise(res=>{
  let i=0;
  (function next(){
   if(window.jspdf&&window.jspdf.jsPDF)return res(true);
   if(i>=srcs.length){pdfLibP=null;return res(false)}
   const s=document.createElement('script');
   s.src=srcs[i++];s.onload=()=>setTimeout(next,150);s.onerror=()=>setTimeout(next,700);
   document.head.appendChild(s);
  })();
 });
 return pdfLibP;
}
setTimeout(loadPdfLib,800);

function unlockOffline(){

function changeOfflinePin(){

 localStorage.setItem('gw_offline_pin',String(nw).trim());

}

function canonOpts(k,key,v){
 const f=(ENT[k].f||[]).find(x=>x[0]===key&&String(x[2]||'').startsWith('opts@'));
 if(!f||!v)return v;
 const opts=f[2].slice(5).split('|').map(s=>s.trim()).filter(Boolean);
 const norm=s=>String(s).trim().replace(/[أإآ]/g,'ا').replace(/خطط/g,'خطة').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase().replace(/^قطاع/,'').replace(/^شركة/,'').replace(/\s+/g,'');

 return hit||v;
}

function doAutoDedup(){
 if(!confirm('🔧 الدمج التلقائي:\n\n• هيتجم كل محطات بنفس الاسم في محطة واحدة\n• هيتحفظ بالنسخة اللي فيها أكتر بيانات\n• الباقي هيروح سلة المحذوفات (تقدر ترجعه)\n\nمتأكد؟'))return;
 const norm=x=>String(x||'').trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').toLowerCase();
 const score=r=>{let t=0;Object.keys(r).forEach(k=>{if(k!=='id'&&k!=='name'&&!k.startsWith('_')&&String(r[k]||'').trim())t+=String(r[k]).length});return t};
 const groups={};liveSites().forEach(r=>{const n=norm(r.name);if(!n)return;(groups[n]=groups[n]||[]).push(r)});
 let removed=0;const report=[];
 Object.keys(groups).forEach(n=>{
  const g=groups[n];if(g.length<2)return;
  g.sort((a,b)=>score(b)-score(a));
  const keep=g[0];
  g.slice(1).forEach(dup=>{
   Object.keys(dup).forEach(k=>{
    if(k==='id'||k==='name')return;
    if(!String(keep[k]||'').trim()&&String(dup[k]||'').trim())keep[k]=dup[k];
   });
   if(Array.isArray(dup.officers)&&dup.officers.length)keep.officers=[...(Array.isArray(keep.officers)?keep.officers:[]),...dup.officers];
   dup.deleted=1;dup._delAt=new Date().toLocaleString('ar-EG');dup._delBy='دمج تلقائي';
   markDirty('sites',dup.id);removed++;
  });
  report.push(keep.name);markDirty('sites',keep.id);
 });
 save();
 alert('✅ تم الدمج!\n\nمحطات مكررة اتحذفت: '+removed+'\nمحطات فضلت (بأكمل بيانات): '+report.length+'\n\n'+(report.length?'• '+report.slice(0,10).join('\n• ')+(report.length>10?'\n…':''):'')+'\n\nكل المحذوف في سلة المحذوفات — تقدر تسترجعه من المزيد.');
 try{const cur=window.__v18cur;if(cur&&window.v18Go)v18Go(cur);else listView('sites')}catch(e){}
}

function doImport(k,rows){
 if(!rows.length)return alert('الملف فاضي أو مفيهوش صفوف بيانات');
 const f=ENT[k].f;
 const norm=s=>String(s??'').trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase().replace(/\s+/g,' ');
 // مطابقة أعمدة الملف بعناوين النظام
 const cols={};
 const stripPar=s=>String(s).replace(/[()]/g,' ').replace(/\s+/g,' ').trim();
 Object.keys(rows[0]).forEach(h=>{
  const nh=norm(h);if(!nh)return;
  f.forEach(([key,,ty])=>{if(cols[key]||ty==='calc')return;
   const nl=norm(lab(k,key));
   if(nh===nl||nh===norm(key)||norm(stripPar(h))===norm(stripPar(lab(k,key))))cols[key]=h;
  });
 });
 const mapped=Object.keys(cols);
 const keyF=f.find(x=>x[0]==='name')||f.find(x=>x[2]===1)||f[0];
 const key0=keyF[0];
 if(!mapped.length)return alert('❌ مفيش أعمدة متطابقة\nلازم أسماء الأعمدة في ملف Excel تكون نفس عناوين النظام:\n'+f.map(([key])=>'• '+lab(k,key)).join('\n'));

 if(!confirm('📥 الأعمدة المتطابقة ('+mapped.length+' من '+f.length+'):\n'+mapped.map(key=>'✓ '+lab(k,key)).join('\n')+'\n\n• لو الاسم موجود قبل كده هيتم تحديث بياناته\n• لو جديد هيتم إضافته\n\nمتابعة الاستيراد؟'))return;
 let added=0,updated=0,skipped=0,dups=0;
 const seen={};
 const preExisting=DB.data[k].slice();
 const used=new Set();
 rows.forEach(r=>{
  const rec={};
  mapped.forEach(key=>{let v=r[cols[key]];if(v==null)return;v=String(v).trim();if(v!=='')rec[key]=v});
  const nm=(rec[key0]||'').trim();
  if(!nm){skipped++;return}
  if(f.some(([kk,ll])=>norm(nm)===norm(ll)||norm(nm)===norm(kk))){skipped++;return}
  mapped.forEach(key=>{if(rec[key])rec[key]=canonOpts(k,key,rec[key])});
  const nn=norm(nm);
  if(seen[nn])dups++;seen[nn]=1;
  let ex=null;
  for(let pi=0;pi<preExisting.length;pi++){
   if(used.has(pi))continue;
   const x=preExisting[pi];
   if(norm(x[key0])===nn&&norm(x.sector||'')===norm(rec.sector||'')&&String(x.fixed_cams||'')===String(rec.fixed_cams||'')&&String(x.ptz_cams||'')===String(rec.ptz_cams||'')&&String(x.booth_cams||'')===String(rec.booth_cams||'')){ex=x;used.add(pi);break}
  }
  if(ex){Object.keys(rec).forEach(key=>{if(key!==key0)ex[key]=rec[key]});ex._at=new Date().toLocaleString('ar-EG');updated++}
  else{rec.id=DB.seq++;rec._by=CUR.u;rec._at=new Date().toLocaleString('ar-EG');DB.data[k].push(rec);added++}
 });
 (DB.data[k]||[]).forEach(r=>markDirty(k,r.id));
 save();listView(k);
 audit('استيراد Excel',ENT[k].t,'جديد: '+added+' / تحديث: '+updated);

 alert('✅ تم الاستيراد بنجاح!\n\n🆕 سجلات جديدة: '+added+'\n🔄 سجلات محدّثة: '+updated+'\n🎯 محطات خطة قادمة: '+DB.data[k].filter(isPlan).length+(dups?'\n⚠️ أسماء مكررة في الملف: '+dups+'\n(اضغط شريط التنبيه الأحمر فوق الجدول لعرضهم)':'')+(skipped?'\n⏭️ متخطّاة (بدون اسم/عنوان مكرر): '+skipped:''));
}

function fcrLightify(html){
 if(!window.__fcrLight)return html;
 return html
  .replace(/background:#1d4e7e;color:#fff/g,'background:#e0e0e0;color:#000')
  .replace(/background:#1d4e7e;font-weight:900/g,'background:#e0e0e0;color:#000;font-weight:900')
  .replace(/background:#1d4e7e;color:#ffd98a/g,'background:#e0e0e0;color:#000')

/* تحويل DOM إلى Canvas عبر SVG foreignObject — رسم عربي بمحرك المتصفح نفسه، بلا html2canvas */
async function fcrDomToCanvas(el,w,h){
 const xml=new XMLSerializer().serializeToString(el.cloneNode(true));
 const svg='<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><foreignObject width="100%" height="100%">'+xml+'</foreignObject></svg>';
 const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
 const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('svg-load'));img.src=url;});
 if(!img.naturalWidth)throw new Error('svg-blank');
 const S=2;
 const cv=document.createElement('canvas');cv.width=w*S;cv.height=h*S;
 const c=cv.getContext('2d');
 c.fillStyle='#ffffff';c.fillRect(0,0,cv.width,cv.height);
 c.scale(S,S);c.drawImage(img,0,0);
 return cv;
}

/* ---------- فك شيفرة Plus Code (كود الموقع المختصر) ---------- */
const OLCA='23456789CFGHJMPQRVWX';
function olcEncode(lat,lng,codeLen){
 lat=Math.min(90,Math.max(-90,lat));lng=((lng+180)%360+360)%360-180;
 let latv=lat+90,lngv=lng+180,lp=20,gp=20,code='',d=0;
 while(d<codeLen){
  if(d===8)code+='+';
  if(d<10){code+=OLCA[Math.floor(latv/lp)];latv%=lp;lp/=20;code+=OLCA[Math.floor(lngv/gp)];lngv%=gp;gp/=20;d+=2}
  else{
   if(d===10){lp*=20;gp*=20}
   lp/=5;gp/=4;
   const r=Math.min(4,Math.max(0,Math.floor(latv/lp))),c=Math.min(3,Math.max(0,Math.floor(lngv/gp)));
   code+=OLCA[Math.min(19,Math.max(0,r*4+c))];
   latv-=r*lp;lngv-=c*gp;d++}
 }
 return code;
}
function olcDecode(code){
 code=code.toUpperCase().replace(/[+]/g,'').replace(/0+$/,'');
 if(code.length<2)return null;
 let lat=0,lng=0,lp=20,gp=20,d=0;
 for(;d<Math.min(code.length,10);d++){const i=OLCA.indexOf(code[d]);if(i<0)return null;
  if(d%2===0){lat+=i*lp;lp/=20}else{lng+=i*gp;gp/=20}}
 let lr=lp*20,gr=gp*20;
 for(;d<code.length;d++){const i=OLCA.indexOf(code[d]);if(i<0)return null;
  lr/=5;gr/=4;lat+=Math.floor(i/4)*lr;lng+=(i%4)*gr}
 return{latC:lat-90+lr/2,lngC:lng-180+gr/2};
}

/* استخراج موقع من نص ملصوق — متسامح: Plus Code قصير/طويل، روابط خرائط، إحداثيات */
function normalizeLocText(t){
 return String(t||'')
  .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .replace(/\b01[0125]\d{8}\b/g,' ') /* موبايل مصري لوحده */
  .replace(/\d{7}(?=\d*[A-Z+])/gi,' ') /* تليفون لازق في Plus Code: نشيل أول 7 أرقام — "3744232355P+RPJ" → "355P+RPJ" */
  .replace(/\b\d{7,8}\b/g,' ') /* تليفون/رقم عقار لوحده */
  .replace(/[＋]/g,'+')
  .replace(/٫/g,'.')
  .replace(/٬/g,'')
  .replace(/[\u200B-\u200D\uFEFF]/g,'')
  .replace(/[?#!]/g,' ')
  .replace(/،/g,' ')
  .replace(/\s+/g,' ')
  .trim();
}

function __normRefTxt(s){
 return String(s||'')
  .replace(/[أإآ]/g,'ا')
  .replace(/ة/g,'ه')
  .replace(/ى/g,'ي')
  .replace(/\s+/g,' ')
  .trim()
  .toLowerCase();
}
function __plusLocalRef(t){
 const n=' '+__normRefTxt(t)+' ';
 const rows=PLUS_LOCAL_REFS.slice().sort((a,b)=>__normRefTxt(b[0]).length-__normRefTxt(a[0]).length);
 for(const row of rows){
  const key=__normRefTxt(row[0]);
  if(key&&n.indexOf(' '+key)>=0)return {name:row[0],lat:row[1],lng:row[2]};
 }
 return null;
}
function __validLL(la,ln){return !isNaN(la)&&!isNaN(ln)&&la>=-90&&la<=90&&ln>=-180&&ln<=180}

function extractLocFromText(raw,cb){
 const t=normalizeLocText(raw);
 const OLCRE='23456789CFGHJMPQRVWX';
 const finish=(ll,note)=>{if(!ll||!__validLL(+ll.lat,+ll.lng))return alert('❌ الكود غير صحيح');cb({lat:+ll.lat,lng:+ll.lng},note)};
 const recover=(rla,rln,note)=>{
  /* نجرب الخلايا المجاورة للمرجع بدل الاكتفاء بخلية وسط المرجع */
  const prefixLen=pm[1].length;
  let latCell=20,lngCell=20,lp=20,gp=20;
  for(let i=0;i<prefixLen;i++){
   if(i%2===0){latCell=lp;lp/=20}
   else{lngCell=gp;gp/=20}
  }
  let best=null,bestD=Infinity;
  for(let da=-1;da<=1;da++){
   for(let db=-1;db<=1;db++){
    const ra=Math.max(-90,Math.min(90,rla+da*latCell));
    const rn=((rln+db*lngCell+540)%360)-180;
    const pfx=olcEncode(ra,rn,10).substring(0,prefixLen);
    const p=olcDecode(pfx+pm[1].toUpperCase()+pm[2].toUpperCase());
    if(!p)continue;
    const d=Math.hypot((p.latC||0)-rla,(p.lngC||0)-rln);
    if(d<bestD){bestD=d;best=p}
   }
  }
  finish(best?{lat:best.latC,lng:best.lngC}:null,best?note:null);
 };

 /* 1) Plus Code كامل: 8G2HX5W3+HP4 */
 let pm=t.match(new RegExp('(['+OLCRE+']{8})\\s*\\+\\s*(['+OLCRE+']{2,3})','i'));
 if(pm){
  const p=olcDecode(pm[1].toUpperCase()+pm[2].toUpperCase());
  if(p){finish({lat:p.latC,lng:p.lngC},'Plus Code كامل');return true}
 }

 /* 2) Plus Code مختصر: X5W3+HP4 الطالبية */
 pm=t.match(new RegExp('(['+OLCRE+']{2,7})\\s*\\+\\s*(['+OLCRE+']{2,3})','i'));
 if(pm){
  const addr=t.replace(pm[0],' ').replace(/\b\d{5,}\b/g,' ').replace(/\s+/g,' ').trim();
  const local=__plusLocalRef(addr);
  if(local){recover(local.lat,local.lng,'تم الفك حسب: '+local.name);return true}

  (async()=>{
   const tries=[addr,(addr?addr+' مصر':''),t.replace(pm[0],' ').trim()]
    .filter((x,i,a)=>x&&x.length>=3&&a.indexOf(x)===i);
   for(const q of tries){
    const r=await geocodeRef(q);
    if(r){recover(r.lat,r.lng,'تم الفك حسب العنوان: '+q);return}
   }
   recover(30.02,31.21,'تم الفك من وسط الجيزة — للدقة اكتب اسم المنطقة بعد الكود');
  })();
  return true;
 }

 /* 3) إحداثيات بأي صيغة شائعة */
 const pats=[
  /(-?\d{1,2}(?:[.,]\d+)?)\s*[,;]\s*(-?\d{1,3}(?:[.,]\d+)?)/,
  /[?&](?:q|query|ll|center|destination|markers|query_place_id)=(-?\d+(?:[.,]\d+)?)[,;\s]+(-?\d+(?:[.,]\d+)?)/i,
  /!3d(-?\d+(?:[.,]\d+)?)!4d(-?\d+(?:[.,]\d+)?)/i,
  /@(-?\d+(?:[.,]\d+)?)\s*[,;]\s*(-?\d+(?:[.,]\d+)?)/,
  /(-?\d{1,2}(?:[.,]\d{3,}))\s+(?:و|,|;)?\s*(-?\d{1,3}(?:[.,]\d{3,}))/
 ];
 for(const re of pats){
  const mm=t.match(re);
  if(!mm)continue;
  const la=parseFloat(String(mm[1]).replace(',','.')),ln=parseFloat(String(mm[2]).replace(',','.'));
  if(__validLL(la,ln)){finish({lat:la,lng:ln},'إحداثيات');return true}
 }

 /* 4) إحداثيات DMS: 29°56'23.2"N 31°11'39.3"E */
 const d1=t.match(/(-?\d{1,2})\s*°\s*(\d{1,2})\s*'\s*(\d{1,2}(?:[.]\d+)?)\s*"?\s*([NS])/i);
 const d2=d1?t.match(/(-?\d{1,3})\s*°\s*(\d{1,2})\s*'\s*(\d{1,2}(?:[.]\d+)?)\s*"?\s*([EW])/i):null;
 if(d1&&d2){
  let la=Math.abs(+d1[1])+(+d1[2])/60+(+d1[3])/3600;if(d1[4].toUpperCase()==='S')la=-la;
  let ln=Math.abs(+d2[1])+(+d2[2])/60+(+d2[3])/3600;if(d2[4].toUpperCase()==='W')ln=-ln;
  finish({lat:+la.toFixed(6),lng:+ln.toFixed(6)},'إحداثيات درجات');
  return true;
 }

 /* 5) رابط جوجل مختصر */
 if(/maps[.]app[.]goo[.]gl|goo[.]gl[/]maps/i.test(t)){
  const pasteBox=document.querySelector('#dlg [name=mapPaste]');
  if(pasteBox)pasteBox.value='⏳ جاري فك الرابط المختصر واستخراج الموقع...';
  resolveShortLink(t,cb);

 /* 6) نص شبه رابط لكن مش مفهوم */
 if(/https|www[.]|\.com|\.gl|@/i.test(t)&&!/\d{1,2}[.]\d{3,}/.test(t)){
  alert('❌ ده مش عنوان واضح.\n\nاللي بيفهمه:\n• Plus Code: W5QV+WM9 أو 8G2HX5W3+HP4\n• إحداثيات: 30.123456, 31.456789\n• رابط خرائط جوجل\n• عنوان واضح: شارع، منطقة، محافظة');
  return true;
 }

 /* 7) عنوان نصي عادي */
 (async()=>{
  const q=t.replace(/\b\d{5,}\b/g,' ').replace(/\s+/g,' ').trim();
  const tries=[q,(q?q+' مصر':'')].filter((x,i,a)=>x&&x.length>=3&&a.indexOf(x)===i);
  for(const x of tries){
   const r=await geocodeRef(x);
   if(r){finish({lat:r.lat,lng:r.lng},'عنوان نصي');return}
  }
  alert('❌ مش قادر أقرأ الموقع.\n\nجرب تكتب واحدة من دول:\n• Plus Code كامل: 8G2HX5W3+HP4\n• Plus Code مختصر + المنطقة: X5W3+HP4 الطالبية\n• إحداثيات: 30.123456, 31.456789\n• رابط خرائط جوجل');
 })();
 return true;
}

/* ترميز العنوان النصي لإحداثيات (Nominatim — مجاني) لاستخدامه كمرجع لاستكمال Plus Code */
async function geocodeRef(addr){
 try{
  if(!addr||addr.length<4)return null;
  const inEgypt=(lat,lng)=>lat>21&&lat<32&&lng>24&&lng<37;
  const parse=(j)=>{
   if(!j)return null;
   if(j.features){for(const f of j.features){const la=f.geometry.coordinates[1],ln=f.geometry.coordinates[0];if(inEgypt(la,ln))return{lat:la,lng:ln}}}
   if(Array.isArray(j)){for(const x of j){const la=+x.lat,ln=+x.lon;if(inEgypt(la,ln))return{lat:la,lng:ln}}}
   return null;
  };
  const tryFetch=async(url)=>{
   const ctl=new AbortController();
   const tm=setTimeout(()=>ctl.abort(),12000);
   try{
    const r=await fetch(url,{signal:ctl.signal,cache:'no-store'});
    if(!r.ok)throw 0;
    return await r.json();
   }finally{clearTimeout(tm)}
  };
  const enc=encodeURIComponent(addr.slice(0,150));
  const encEg=encodeURIComponent((addr+' مصر').slice(0,160));
  const nomi=(q,bounded)=> 'https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=eg&accept-language=ar&viewbox=24.5,31.7,36.9,21.8&bounded='+(bounded?1:0)+'&q='+q;
  const photon=(q)=> 'https://photon.komoot.io/api/?limit=5&bbox=24.5,21.8,36.9,31.7&accept-language=ar&q='+q;
  const tries=[
   ()=>tryFetch(photon(enc)),
   ()=>tryFetch(nomi(enc,1)),
   ()=>tryFetch(nomi(enc,0)),
   ()=>tryFetch('https://api.allorigins.win/raw?url='+encodeURIComponent(photon(enc))),
   ()=>tryFetch('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(nomi(enc,0))),
   ()=>tryFetch(nomi(encEg,1)),
   ()=>tryFetch('https://api.cors.lol/?url='+encodeURIComponent(photon(enc)))
  ];
  for(const fn of tries){
   try{const j=await fn();const r=parse(j);if(r)return r}catch(e){}
  }
 }catch(e){}
 return null;
}

/* 📎 المرفقات: كل صورة في مستند مستقل — Firestore بيقفل الكتابة أوفلاين ويرفعها لما النت يرجع */
async function attLoadKey(key){
 try{
  const local=DB.att[key];
  if(local&&local.__loaded)return local;
  const snap=await ATTREC.where('key','==',key).get().catch(()=>null);
  const items=snap?snap.docs.map(d=>({id:d.id,name:d.data().name,d:d.data().d})):[];items.__loaded=1;
  DB.att[key]=items;
  return items;
 }catch(e){return DB.att[key]||[]}
}

function attDel(key,i,k,id){

 DB.att[key].splice(i,1);
 try{localStorage.setItem('gw_sec_cache',JSON.stringify(DB))}catch(e){}

 <div style="margin-top:10px">${list.map((a,i)=>`<div class="item"><b>${esc(a.name)}</b>${a.d?'':' <span class="chip" style="font-size:10px;background:#fdf3e7;color:#b05f10">📴 غير متاح أوفلاين</span>'}<br><img src="${a.d||''}" style="max-width:100%;border-radius:8px;margin:6px 0;${a.d?'':'display:none'}">
 <div class="row"><button class="btn btn2" onclick="attOpen('${key}',${i})">👁 فتح</button>

 <button class="btn btn2" style="width:100%;margin-top:8px" onclick="dlg.close();listView('${k}')">إغلاق</button></div>`);

function attAdd(key,inp){
 [...inp.files].forEach(f=>{
  if(!f||!f.type||f.type.indexOf('image/')!==0){alert('❌ مسموح بالصور فقط');return}
  const r=new FileReader();
  r.onload=e=>{
   const img=new Image();
   img.onload=()=>{
    try{
     const max=1000;
     const sc=Math.min(1,max/Math.max(img.width||1,img.height||1));
     const w=Math.max(1,Math.round((img.width||1)*sc));
     const h=Math.max(1,Math.round((img.height||1)*sc));
     const cv=document.createElement('canvas');cv.width=w;cv.height=h;
     const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
     const d=cv.toDataURL('image/jpeg',0.72);
     if(d.length>650000){alert('⚠️ الصورة كبيرة حتى بعد الضغط التلقائي.\nقلل حجم الصورة أو استخدم صورة أقل دقة.');return}
     DB.att[key]=DB.att[key]||[];DB.att[key].push({name:f.name,d});
     try{localStorage.setItem('gw_sec_cache',JSON.stringify(DB))}catch(e){}
     const parts=key.split(':');attView(parts[0],+parts[1]);
     /* Firestore بيشتغل أوفلاين: الكتابة بتتخزن محلياً وبتترفع لما النت يرجع */
     ATTREC.add({key:key,name:f.name,d:d}).then(ref=>{
      const it=(DB.att[key]||[]).find(x=>x.name===f.name&&x.d===d);
      if(it)it.id=ref.id;
      try{localStorage.setItem('gw_sec_cache',JSON.stringify(DB))}catch(e){}
     }).catch(()=>{});
    }catch(err){alert('❌ تعذر معالجة الصورة')}
   };
   img.src=e.target.result;
  };
  r.readAsDataURL(f);
 });
}

function xlsTemplateGuards(){
 loadXlsx().then(ok=>{
  if(!ok)return alert('تعذر تحميل مكتبة Excel — تحقق من الاتصال بالإنترنت');
  const ws=XLSX.utils.aoa_to_sheet([
   ['اسم المحطة','اسم المسؤول','المسمى الوظيفي','الهاتف'],
   ['محطة مياه الجيزة الاوسط','احمد السيد','مدير الإدارة','01111222333']]);
  ws['!cols']=[{wch:32},{wch:20},{wch:18},{wch:16}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'المسؤولون');
  XLSX.writeFile(wb,'نموذج_مسؤولي_الامن.xlsx');
 });
}
function importGuardsXls(){
 if(typeof CUR!=='undefined'&&CUR.role==='viewer'){alert('صلاحية مشاهدة فقط');return}
 loadXlsx().then(ok=>{
  if(!ok)return alert('تعذر تحميل مكتبة قراءة Excel — تحقق من الاتصال');
  const inp=document.createElement('input');inp.type='file';inp.accept='.xls,.xlsx,.csv';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
   rd.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    doGuardsImport(XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}));
   }catch(err){alert('❌ ملف غير صالح: '+err.message)}};
   rd.readAsArrayBuffer(f);};
  inp.click();
 });
}
function doGuardsImport(rows){
 if(!rows.length)return alert('الملف فاضي');
 const norm=x=>String(x??'').trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');
 const cols={};
 Object.keys(rows[0]).forEach(h=>{const nh=norm(h);
  if(nh===norm('اسم المحطة'))cols.st=h;
  else if(nh===norm('اسم المسؤول')||nh===norm('الاسم'))cols.nm=h;
  else if(nh.indexOf('المسمى')>=0||nh.indexOf('الوظيف')>=0)cols.ti=h;
  else if(nh===norm('الهاتف')||nh===norm('التليفون')||nh===norm('التواصل')||nh===norm('رقم الهاتف'))cols.ph=h;
 });
 if(!cols.st||!cols.nm)return alert('❌ الأعمدة المطلوبة: «اسم المحطة» + «اسم المسؤول»\n\nالأعمدة الموجودة في ملفك:\n'+Object.keys(rows[0]).join(' | '));
 if(!confirm('📥 استيراد '+rows.length+' صف\n• المحطة: '+cols.st+'\n• المسؤول: '+cols.nm+'\n• المسمى: '+(cols.ti||'—')+'\n• الهاتف: '+(cols.ph||'—')+'\n\nمتابعة؟'))return;
 let added=0,skipped=0,noStation=0;const missing=[];
 rows.forEach(r=>{
  const stName=String(r[cols.st]||'').trim();
  const nm=String(r[cols.nm]||'').trim();
  if(!stName||!nm){skipped++;return}
  const st=liveSites().find(x=>norm(x.name)===norm(stName));
  if(!st){noStation++;if(missing.indexOf(stName)<0)missing.push(stName);return}
  const ti=cols.ti?String(r[cols.ti]||'').trim():'';
  const ph=cols.ph?String(r[cols.ph]||'').replace(/[^0-9+/ ]/g,'').trim():'';
  if(!Array.isArray(st.officers)||!st.officers.length)st.officers=(st.manager||'').trim()?[{n:st.manager,t:st.g_status||'',p:st.phone||''}]:[];
  if(st.officers.some(o=>norm(o.n)===norm(nm)&&(o.p||'')===ph)){skipped++;return}
  st.officers.push({n:nm,t:ti,p:ph});
  st.manager=st.officers[0].n;st.g_status=st.officers[0].t;st.phone=st.officers[0].p;
  st._by=(typeof CUR!=='undefined'&&CUR.u)||'مستخدم';st._at=new Date().toLocaleString('ar-EG');
  markDirty('sites',st.id);added++;
 });
 save();
 audit('استيراد Excel','مسؤولو الأمن','جدد: '+added+' / تخطي: '+skipped);
 try{const cur=window.__v18cur;if(cur==='guards'&&typeof guardsSummary!=='undefined')guardsSummary();else if(cur&&window.v18Go)v18Go(cur);else listView('sites')}catch(e){}
 alert('✅ تم الاستيراد!\n\n👮 مسؤولون جدد: '+added+'\n⏭️ متخطّون (مكرر/ناقص): '+skipped+(noStation?'\n\n⚠️ محطات مش موجودة بالنظام ('+noStation+'):\n• '+missing.slice(0,8).join('\n• ')+(missing.length>8?'\n…':'')+'\n\n(لازم اسم المحطة في Excel يطابق المسجل بالظبط)':''));
}

/* ---------- محرك PDF: رسم يدوي على Canvas + jsPDF ---------- */
function wrapText(c,text,maxW){
 const words=String(text??'').split(/\s+/).filter(x=>x!=='');const lines=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;
  if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
 if(cur)lines.push(cur);
 return lines.length?lines:[''];
}
async function renderPdfPages(k,rows,only){
 let F=orderedFields(k);if(only&&only.length)F=F.filter(f=>only.includes(f[0]));
 const W=1122,H=793,M=19,S=2;
 const img=new Image();img.src=LOGO_SRC;
 try{await img.decode()}catch(e){}
 // عرض الأعمدة
 const c0=document.createElement('canvas').getContext('2d');
 const avail=W-2*M-36;
 const lens=F.map(f=>{let L=(f[1]||'').length;
  rows.forEach(r=>{const v=f[0]==='_map'?(r.lat?r.lat+', '+r.lng:''):r[f[0]];if(v)L=Math.max(L,String(v).length)});
  return L});
 let ws=lens.map((L,fi)=>Math.max(fi===0?130:56,Math.min(190,L*6.4+16)));
 const sum=ws.reduce((a,b)=>a+b,0);
 ws=ws.map(w=>w*avail/sum);
 const pages=[];let cv,c,y,pageRows;
 function newPage(){
  cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;
  c=cv.getContext('2d');c.scale(S,S);
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  c.textBaseline='middle';c.direction='rtl';
  // الترويسة
  if(img.complete&&img.naturalWidth)c.drawImage(img,M,M,42,42);
  c.textAlign='right';
  c.fillStyle='#000';c.font='bold 14.5px Tahoma, Arial';
  c.fillText('الشركة القابضة لمياه الشرب والصرف الصحى',W-M,M+9);
  c.font='12.5px Tahoma, Arial';
  c.fillText('شركة مياه الشرب والصرف الصحي بالجيزة',W-M,M+26);
  c.font='bold 13px Tahoma, Arial';
  c.fillText('(الإدارة العامة للأمن)',W-M,M+43);
  // خط فاصل
  c.strokeStyle='#333';c.lineWidth=1.2;
  c.beginPath();c.moveTo(M,M+56);c.lineTo(W-M,M+56);c.stroke();
  // العنوان
  c.textAlign='center';c.font='bold 16px Tahoma, Arial';
  c.fillText('(حصر اعداد الكاميرات)',W/2,M+78);
  y=M+96;
  pageRows=[];
 }
 function cellText(text,x,w,align,bold,color,size){
  c.font=(bold?'bold ':'')+(size||14)+'px Tahoma, Arial';
  c.fillStyle=color||'#111';
  c.textAlign=align;
  const lines=wrapText(c,text,w-10);
  const lh=(size||14)+6;
  lines.forEach((ln,i)=>c.fillText(ln, align==='right'?x+w-6:align==='center'?x+w/2:x+6, y+12+i*lh));
  return lines.length*lh+8;
 }
 function headerRow(){
  const hs=F.map((f,fi)=>{c.font='bold 14px Tahoma, Arial';
   return wrapText(c,f[1],ws[fi]-10).length*19+14});
  const hh=Math.max(38,...hs);
  const R=W-M;
  c.fillStyle='#c8d8ea';c.fillRect(M,y,W-2*M,hh);
  c.strokeStyle='#5d7086';c.lineWidth=1.1;c.strokeRect(M,y,W-2*M,hh);
  c.fillStyle='#b3c7dd';c.fillRect(R-36,y,36,hh);
  c.strokeStyle='#5d7086';c.beginPath();c.moveTo(R-36,y);c.lineTo(R-36,y+hh);c.stroke();
  cellText('م',R-36,36,'center',true,'#16324f',11);
  let x=R-36;
  F.forEach((f,fi)=>{const cw=ws[fi];x-=cw;
   cellText(f[1],x,cw,'center',true,'#16324f',11);
   c.strokeStyle='#5d7086';c.beginPath();c.moveTo(x,y);c.lineTo(x,y+hh);c.stroke()});
  y+=hh;
 }
 function dataRow(r,idx,tint){
  const val=f=>f[0]==='_map'?(r.lat?r.lat+', '+r.lng:''):(r[f[0]]??'');
  c.font='18px Tahoma, Arial';
  const hs=F.map((f,fi)=>wrapText(c,val(f),ws[fi]-10).length*15.5+10);
  const rh=Math.max(26,...hs);
  const R=W-M;
  if(tint){c.fillStyle=tint;c.fillRect(M,y,W-2*M,rh)}
  else if(idx%2===1){c.fillStyle='#f4f8fb';c.fillRect(M,y,W-2*M,rh)}
  c.fillStyle='#c8d8ea';c.fillRect(R-36,y,36,rh);
  cellText(String(idx+1),R-36,36,'center',true,'#16324f',11);
  let x=R-36;
  F.forEach((f,fi)=>{const cw=ws[fi];x-=cw;
   c.strokeStyle='#8fa2b5';c.beginPath();c.moveTo(x,y);c.lineTo(x,y+rh);c.stroke();
   cellText(val(f),x,cw,fi===1?'right':'center',fi===1,'#111',11)});
  c.strokeStyle='#5d7086';c.lineWidth=1;c.strokeRect(M,y,W-2*M,rh);
  y+=rh;
 }
 function totalsRow(){
  if(k!=='sites')return;
  const t=f=>rows.reduce((s,r)=>s+(parseFloat(r[f])||0),0);
  c.font='bold 11.5px Tahoma, Arial';

  c.fillStyle='#1d4e7e';c.fillRect(M,y,W-2*M,rh);
  c.fillStyle='#163a5c';c.fillRect(R-36,y,36,rh);
  c.strokeStyle='#16324f';c.strokeRect(M,y,W-2*M,rh);
  cellText('',R-36,36,'center',true,'#fff',11);
  let x=R-36;
  F.forEach((f,fi)=>{const cw=ws[fi];x-=cw;
   const v=f[0]==='name'?'الإجمالي':f[0]==='fixed_cams'?t('fixed_cams'):f[0]==='ptz_cams'?t('ptz_cams'):'';
   cellText(String(v),x,cw,fi===1?'right':'center',true,'#ffffff',11.5)});
  y+=rh;
 }
 function footer(){
  c.font='16px Tahoma, Arial';c.fillStyle='#888';c.textAlign='left';c.direction='ltr';
  c.fillText('By: Essam Diab',M,H-16);
  c.direction='rtl';
 }
 newPage();headerRow();
 rows.forEach((r,idx)=>{
  const val=f=>f[0]==='_map'?(r.lat?r.lat+', '+r.lng:''):(r[f[0]]??'');
  c.font='11px Tahoma, Arial';
  const hs=F.map((f,fi)=>wrapText(c,val(f),ws[fi]-10).length*15.5+10);
  const rh=Math.max(26,...hs);
  if(y+rh>H-34){footer();pages.push({cv,c});newPage();headerRow()}
  dataRow(r,idx);
 });
 totalsRow();footer();
 pages.push({cv,c});
 pages.forEach((p,i)=>{p.c.font='11px Tahoma, Arial';p.c.fillStyle='#888';p.c.textAlign='right';p.c.direction='rtl';p.c.fillText('صفحة '+(i+1)+' من '+pages.length,W-19,H-16);p.c.direction='ltr'});
 return pages;
}
async function makePdfBlob(k,btn,only){
 const kw=(listView.kw||'');
 let rows=(listView.dispEnt===k&&listView.dispRows)?listView.dispRows.filter(r=>!kw||JSON.stringify(r).includes(kw)).slice():DB.data[k].filter(r=>!kw||JSON.stringify(r).includes(kw));
 if(k==='sites'&&listView.sec)rows=rows.filter(r=>(r.sector||'بدون قطاع')===listView.sec);
 if(!rows.length){alert('لا توجد بيانات');return null}
 if(btn){btn.innerHTML='⏳';btn.disabled=true}
 try{
  const pages=await renderPdfPages(k,rows,only);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'px',format:[1122,793],orientation:'landscape',hotfixes:['px_scaling'],compress:true});
  pages.forEach((d,idx)=>{if(idx>0)doc.addPage([1122,793],'landscape');doc.addImage(d.cv,'JPEG',0,0,1122,793,undefined,'FAST')});
  return doc.output('blob');
 }catch(e){alert('تعذر إنشاء PDF: '+(e&&e.message||e));return null}
 finally{if(btn)btn.disabled=false}
}

/* ---------- ترتيب الأعمدة ---------- */
function orderedFields(k){
 const F=ENT[k].f;
 const o=(DB.fieldOrder||{})[k];
 if(!o)return F;
 const map={};F.forEach(f=>map[f[0]]=f);
 const out=o.map(key=>map[key]).filter(Boolean);
 F.forEach(f=>{if(!o.includes(f[0]))out.push(f)});
 return out;
}
function moveField(k,fk,dir){
 const cur=orderedFields(k).map(f=>f[0]);
 const i=cur.indexOf(fk);const j=i+dir;
 if(i<0||j<0||j>=cur.length)return;
 [cur[i],cur[j]]=[cur[j],cur[i]];
 DB.fieldOrder=DB.fieldOrder||{};DB.fieldOrder[k]=cur;
 save();lblList();
}

let dragFk=null;

function rowDragOver(ev,el){ev.preventDefault();el.style.background='#dbe7f3'}
function rowDragLeave(el){el.style.background=''}
function rowDrop(k,targetFk,el){
 el.style.background='';
 if(!dragFk||dragFk===targetFk){dragFk=null;return}
 const cur=orderedFields(k).map(f=>f[0]);
 const from=cur.indexOf(dragFk), to=cur.indexOf(targetFk);

 dragFk=null;
 save();lblList();
}

/* دعوة مستخدم جديد — إنشاء الحساب بتطبيق Firebase ثانوي مؤقت عشان جلسة المدير متتقفش */
async function inviteUser(){
 if(CUR.role!=='admin'){alert('⛔ دعوة المستخدمين للمدير فقط');return}
 const em=(prompt('📧 بريد المستخدم الجديد:')||'').trim();
 if(!em||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return alert('❌ البريد غير صحيح');
 const pw=prompt('🔑 كلمة مرور مؤقتة (6 حروف أو أكتر) — المستخدم يغيّرها بعدين من تغيير كلمة المرور:');
 if(pw===null)return;
 if(pw.length<6)return alert('❌ لازم 6 حروف على الأقل');
 const nm='invite-'+Date.now();
 try{
  const app2=firebase.initializeApp(FBC,nm);
  await firebase.auth(app2).createUserWithEmailAndPassword(em,pw);
  try{await firebase.auth(app2).signOut()}catch(e){}
  try{await firebase.app(nm).delete()}catch(e){}
  DB.roles=DB.roles||{};DB.roles[em]=DB.roles[em]||'viewer';
  saveRoles();save();audit('دعوة مستخدم','المستخدمين',em);
  setView();
  alert('✅ تم إنشاء الحساب بنجاح\n\nالبريد: '+em+'\nالصلاحية: مشاهدة (ممكن ترفعها من قائمة المستخدمين)\n\nابعتله البريد وكلمة المرور المؤقتة على واتساب');
 }catch(e){
  try{firebase.app(nm).delete()}catch(_){}
  if(e.code==='auth/email-already-in-use')return alert('❌ البريد ده مسجل قبل كده');
  if(e.code==='auth/weak-password')return alert('❌ كلمة المرور ضعيفة');
  alert('❌ حصل خطأ: '+((e&&e.message)||e));
 }
}

function v18ContractDueList(){
 const out=[];
 (DB.data.companies||[]).forEach(c=>{
  const e=(c.contract_end||'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e))return;
  const d=Math.ceil((new Date(e+'T00:00:00')-new Date())/86400000);
  if(d<=30)out.push({c:c,d:d});
 });
 return out;
}

function v18ApplyGuardsCard(){
 const f=(window._v18g||{}).card||'';
 const labels={with:'لها مسؤول أمن',without:'بدون مسؤول',phone:'لها هاتف تواصل'};
 /* شريط الفلتر النشط — دايماً يظهر فوق الجدول عشان تعرف إيه اللي هيتطبع */
 document.querySelectorAll('#v18gActiveBar').forEach(x=>x.remove());
 if(!f)return;
 const rows=(DB.data.sites||[]);
 const pass=id=>{
  const r=rows.find(x=>String(x.id)===String(id));if(!r)return true;
  const has=(r.manager||'').trim();
  if(f==='with')return !!has;
  if(f==='without')return !has;
  if(f==='phone')return !!(r.phone||'').trim();
  return true;
 };
 let shown=0,total=0;
 document.querySelectorAll('#pg table tbody tr').forEach(tr=>{
  const el=tr.querySelector('[onclick*="openOfficers("]');
  if(!el)return;
  const m=(el.getAttribute('onclick')||'').match(/openOfficers\((\d+)\)/);
  if(!m)return;
  total++;
  const ok=pass(m[1]);
  if(ok)shown++;
  tr.style.display=ok?'':'none';
 });
 const bar=document.createElement('div');
 bar.id='v18gActiveBar';
 bar.style.cssText='display:flex;align-items:center;gap:8px;background:#e8f0fa;border:1.5px solid #1d4e7e;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13px;font-weight:700;color:#1d4e7e';
 bar.innerHTML='<span>🎯 الفلتر النشط: '+esc(labels[f]||f)+' — <b style="color:#0d7377">'+shown+'</b> من '+total+' محطة</span>'
 +'<span style="margin-inline-start:auto;display:inline-flex;gap:6px">'
 +'<button class="btn btn2" style="padding:4px 12px;font-size:12px" onclick="v18GuardsCard(\'\')">✕ مسح الفلتر</button></span>';
 const tbl=document.querySelector('#pg .tbl-wrap')||document.querySelector('#pg table');
 if(tbl&&tbl.parentNode)tbl.parentNode.insertBefore(bar,tbl);
}

try{
 if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  let __swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!__swReloaded){__swReloaded=true;location.reload()}});
  window.addEventListener('load',()=>{
   const clearOld=async()=>{
    try{const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}catch(e){}
    try{const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}catch(e){}
   };
   clearOld().finally(()=>{
    navigator.serviceWorker.register('offline-sw.js?v=20261029-0949').then(reg=>{
     reg.update();
     if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
    }).catch(()=>{});
   });
  });
 }
