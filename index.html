<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f4f6f9;color:#222}
header{background:#1d4e7e;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:9}
header img{width:36px;height:36px;border-radius:50%;background:#fff}
header b{font-size:15px}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #c8d2e0;position:sticky;top:56px;z-index:8}
nav button{flex:0 0 auto;padding:11px 14px;border:none;background:#fff;color:#33475b;font-size:13px;border-bottom:3px solid transparent}
nav button.on{color:#1d4e7e;border-bottom-color:#1d4e7e;font-weight:bold}
main{padding:12px}
.card{background:#fff;border:1px solid #c8d2e0;border-radius:10px;padding:9px 11px;margin-bottom:4px}
.card+.card{border-top:2px solid #b9c8d9}
input,select,textarea{width:100%;padding:9px;border:1px solid #c8d2e0;border-radius:8px;font-size:14px;margin-bottom:8px}
textarea{min-height:70px}
label{font-size:12px;color:#33475b;display:block;margin-bottom:3px}
.btn{background:#1d4e7e;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn2{background:#e6ecf4;color:#1d4e7e}
.btn3{background:#c0392b}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
th{background:#1d4e7e;color:#fff;padding:12px 7px;position:sticky;top:0}
td{padding:12px 7px;border-bottom:1.5px solid #b8c4d4;border-left:1.5px solid #b8c4d4;text-align:center}
th{border-left:1.5px solid #4a7099}
tr:nth-child(even){background:#f0f4f9}
.tbl-wrap{overflow-x:auto;max-height:60vh;overflow-y:auto;border:1px solid #c8d2e0;border-radius:10px}
dialog{border:none;border-radius:14px;padding:0;width:96%;max-width:640px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.mhead{background:#1d4e7e;color:#fff;padding:12px;font-weight:bold;border-radius:14px 14px 0 0}
.mbody{padding:16px;max-height:78vh;overflow-y:auto}
.chip{display:inline-block;background:#e6ecf4;color:#1d4e7e;border-radius:12px;padding:2px 10px;font-size:12px;margin:2px}
.item{border:1px solid #dde5ee;border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.item b{color:#1d4e7e}
.muted{color:#888;font-size:12px}
body.dark{background:#141b24;color:#dbe4ee}
body.dark .card{background:#1c2634;border-color:#2e3d52}
body.dark input,body.dark select,body.dark textarea{background:#232f40;border-color:#3a4c66;color:#e6eef7}
body.dark nav{background:#1c2634}
body.dark nav button{background:#1c2634;color:#aab8cb}
body.dark nav button.on{color:#6db3ff}
body.dark th{background:#24405f}
body.dark td{border-color:#2e3d52}
body.dark tr:nth-child(even){background:#202b3b}
body.dark .tbl-wrap{border-color:#2e3d52}
body.dark dialog{background:#1c2634}
body.dark .item{background:#1c2634;border-color:#2e3d52}
body.dark .chip{background:#2b3c55;color:#9fc3e8}
body.dark label{color:#9fb0c4}
body.dark .muted{color:#8b9bb0}
</style>
</head>

function loginView(){
 $('#app').innerHTML=`<main><div class="card" style="text-align:center;margin-top:40px">
 <h2 style="color:#1d4e7e">🛡️ تسجيل الدخول</h2><p class="muted">نظام إدارة أمن المحطات — شركة مياه الجيزة<br><b style="color:#1d7e4e">النسخة السحابية ☁️</b></p>
 <input id="lu" type="email" placeholder="البريد الإلكتروني" dir="ltr" style="text-align:left">
 <input id="lp" type="password" placeholder="كلمة المرور" dir="ltr" style="text-align:left">
 <button class="btn" style="width:100%" onclick="doLogin()">دخول</button>
 <p style="margin-top:10px"><a href="#" onclick="forgotPw();return false" style="color:#1d4e7e;font-size:13px">🔑 نسيت كلمة المرور؟</a></p>
 <p class="muted" style="margin-top:6px">أول حساب يسجل دخول يصبح <b>مديراً</b> تلقائياً</p></div></main>`;
 $('#lp').onkeydown=e=>{if(e.key==='Enter')doLogin()};
}
function doLogin(){
 AUTH.signInWithEmailAndPassword($('#lu').value.trim(),$('#lp').value)
 .then(()=>{try{localStorage.setItem('gw_mypw',$('#lp').value)}catch(e){}})
 .catch(e=>alert('بيانات الدخول غير صحيحة'));
}
AUTH.onAuthStateChanged(async u=>{
 const __cm=location.search.match(/[?&]card=([\w-]+)/);
 if(__cm){cardMode(__cm[1]);return}
 if(!u){CUR=null;loginView();return}
 CUR={u:u.email.split('@')[0],email:u.email,role:'viewer'};
 try{
  const d=await DOC.get();
  if(d.exists&&d.data().db){DB=d.data().db}else{DB=freshDB();DOC.set({db:DB,at:Date.now()})}
  const a=await DOCS_ATT.get();DB.att=(a.exists&&a.data().att)||{};
 }catch(e){alert('تعذر الاتصال بالسيرفر — تأكد من النت');return}
 DB.roles=DB.roles||{};
 if(!DB.roles[u.email]){
  DB.roles[u.email]=Object.keys(DB.roles).length===0?'admin':'viewer';
  save();
 }
 CUR.role=DB.roles[u.email];
 audit('دخول','','');
 save();
 // النسخة الاحتياطية التلقائية الأسبوعية
 try{
  if(!DB.lastBackup||Date.now()-DB.lastBackup>7*24*3600*1000){
   FS.doc('gw/auto_backup').set({snap:JSON.parse(JSON.stringify(DB)),at:Date.now(),by:u.email});
   DB.lastBackup=Date.now();save();
  }
 }catch(e){}
 mainView();
});

async function forgotPw(){

 try{
  await AUTH.sendPasswordResetEmail(em.trim());
  alert('✅ تم إرسال رابط إعادة التعيين\n\nافتح بريدك الإلكتروني (وتأكد من مجلد Spam/العشوائي) ← اضغط الرابط ← اكتب كلمة المرور الجديدة');
 }catch(e){alert('❌ البريد غير مسجل — تأكد من كتابته صح أو اسأل المدير يضيفك من جديد');}
}

function loadXlsx(){

 if(xlsxP)return xlsxP;
 const srcs=['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  'https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  'https://gcore.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',

  'https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
 xlsxP=new Promise(res=>{let i=0;(function next(){
  if(window.XLSX)return res(true);

function sectorOpts(k){

function optsFields(k){

function canonOpts(k,key,v){
 const f=(ENT[k].f||[]).find(x=>x[0]===key&&String(x[2]||'').startsWith('opts@'));
 if(!f||!v)return v;
 const opts=f[2].slice(5).split('|').map(s=>s.trim()).filter(Boolean);
 const norm=s=>String(s).trim().replace(/[أإآ]/g,'ا').replace(/خطط/g,'خطة').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase().replace(/^قطاع/,'').replace(/^شركة/,'').replace(/\s+/g,'');
 const nv=norm(v);if(!nv)return v;
 const hit=opts.find(o=>{const no=norm(o);return no===nv||no.includes(nv)||nv.includes(no)});
 return hit||v;
}

let mapObj=null,leafP=null;
function loadLeaflet(){

 if(leafP)return leafP;

  const css=['https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'];
  css.forEach(h=>{const l=document.createElement('link');l.rel='stylesheet';l.href=h;document.head.appendChild(l)});

  const tryJs=i=>{
   if(window.L)return res(true);
   if(i>=srcs.length){leafP=null;return res(false)}
   const s=document.createElement('script');s.src=srcs[i];
   s.onload=()=>setTimeout(()=>res(true),250);
   s.onerror=()=>tryJs(i+1);
   document.head.appendChild(s);
  };
  tryJs(0);
 });
 return leafP;
}

function doImport(k,rows){
 if(!rows.length)return alert('الملف فاضي أو مفيهوش صفوف بيانات');
 const f=ENT[k].f;
 const norm=s=>String(s??'').trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase().replace(/\s+/g,' ');
 // مطابقة أعمدة الملف بعناوين النظام
 const cols={};
 const stripPar=s=>String(s).replace(/[()]/g,' ').replace(/\s+/g,' ').trim();
 Object.keys(rows[0]).forEach(h=>{
  const nh=norm(h);if(!nh)return;
  f.forEach(([key,,ty])=>{if(cols[key]||ty==='calc')return;
   const nl=norm(lab(k,key));
   if(nh===nl||nh===norm(key)||norm(stripPar(h))===norm(stripPar(lab(k,key))))cols[key]=h;
  });
 });
 const mapped=Object.keys(cols);
 const keyF=f.find(x=>x[0]==='name')||f.find(x=>x[2]===1)||f[0];
 const key0=keyF[0];
 if(!mapped.length)return alert('❌ مفيش أعمدة متطابقة\nلازم أسماء الأعمدة في ملف Excel تكون نفس عناوين النظام:\n'+f.map(([key])=>'• '+lab(k,key)).join('\n'));

 if(!confirm('📥 الأعمدة المتطابقة ('+mapped.length+' من '+f.length+'):\n'+mapped.map(key=>'✓ '+lab(k,key)).join('\n')+'\n\n• لو الاسم موجود قبل كده هيتم تحديث بياناته\n• لو جديد هيتم إضافته\n\nمتابعة الاستيراد؟'))return;
 let added=0,updated=0,skipped=0,dups=0;
 const seen={};
 const preExisting=DB.data[k].slice();
 const used=new Set();
 rows.forEach(r=>{
  const rec={};
  mapped.forEach(key=>{let v=r[cols[key]];if(v==null)return;v=String(v).trim();if(v!=='')rec[key]=v});
  const nm=(rec[key0]||'').trim();
  if(!nm){skipped++;return}
  if(f.some(([kk,ll])=>norm(nm)===norm(ll)||norm(nm)===norm(kk))){skipped++;return}
  mapped.forEach(key=>{if(rec[key])rec[key]=canonOpts(k,key,rec[key])});
  const nn=norm(nm);
  if(seen[nn])dups++;seen[nn]=1;
  let ex=null;
  for(let pi=0;pi<preExisting.length;pi++){
   if(used.has(pi))continue;
   const x=preExisting[pi];
   if(norm(x[key0])===nn&&norm(x.sector||'')===norm(rec.sector||'')&&String(x.fixed_cams||'')===String(rec.fixed_cams||'')&&String(x.ptz_cams||'')===String(rec.ptz_cams||'')&&String(x.booth_cams||'')===String(rec.booth_cams||'')){ex=x;used.add(pi);break}
  }
  if(ex){Object.keys(rec).forEach(key=>{if(key!==key0)ex[key]=rec[key]});ex._at=new Date().toLocaleString('ar-EG');updated++}
  else{rec.id=DB.seq++;rec._by=CUR.u;rec._at=new Date().toLocaleString('ar-EG');DB.data[k].push(rec);added++}
 });
 save();listView(k);
 audit('استيراد Excel',ENT[k].t,'جديد: '+added+' / تحديث: '+updated);

 alert('✅ تم الاستيراد بنجاح!\n\n🆕 سجلات جديدة: '+added+'\n🔄 سجلات محدّثة: '+updated+'\n🎯 محطات خطة قادمة: '+DB.data[k].filter(isPlan).length+(dups?'\n⚠️ أسماء مكررة في الملف: '+dups+'\n(اضغط شريط التنبيه الأحمر فوق الجدول لعرضهم)':'')+(skipped?'\n⏭️ متخطّاة (بدون اسم/عنوان مكرر): '+skipped:''));
}

async function qrShare(silent){

 if(!items.length)return;

 for(const it of items){

  const c=cv.getContext('2d');
  c.fillStyle='#ffffff';c.fillRect(0,0,380,450);

  const nm=it.querySelector('.qrn').textContent;

  c.fillText('حصر كاميرات الأمن — مياه الجيزة',190,420,340);
  const b=await new Promise(res=>cv.toBlob(res,'image/png'));
  if(b)files.push(new File([b],'QR_'+nm.replace(/[\\/:*?"<>|]/g,'_')+'.png',{type:'image/png'}));
 }
 if(files.length&&navigator.canShare&&navigator.canShare({files})){

 }

 }
}

/* ---------- فك شيفرة Plus Code (كود الموقع المختصر) ---------- */
const OLCA='23456789CFGHJMPQRVWX';
function olcEncode(lat,lng,codeLen){
 lat=Math.min(90,Math.max(-90,lat));lng=((lng+180)%360+360)%360-180;
 let latv=lat+90,lngv=lng+180,lp=20,gp=20,code='',d=0;
 while(d<codeLen){
  if(d===8)code+='+';
  if(d<10){code+=OLCA[Math.floor(latv/lp)];latv%=lp;lp/=20;code+=OLCA[Math.floor(lngv/gp)];lngv%=gp;gp/=20;d+=2}
  else{lp/=5;gp/=4;const r=Math.floor(latv/lp),c=Math.floor(lngv/gp);code+=OLCA[r*4+c];latv-=r*lp;lngv-=c*gp;d++}
 }
 return code;
}
function olcDecode(code){
 code=code.toUpperCase().replace(/[+]/g,'').replace(/0+$/,'');
 if(code.length<2)return null;
 let lat=0,lng=0,lp=20,gp=20,d=0;
 for(;d<Math.min(code.length,10);d++){const i=OLCA.indexOf(code[d]);if(i<0)return null;
  if(d%2===0){lat+=i*lp;lp/=20}else{lng+=i*gp;gp/=20}}
 let lr=lp,gr=gp;
 for(;d<code.length;d++){const i=OLCA.indexOf(code[d]);if(i<0)return null;
  lr/=5;gr/=4;lat+=Math.floor(i/4)*lr;lng+=(i%4)*gr}
 return{latC:lat-90+lr/2,lngC:lng-180+gr/2};
}
function olcFromText(t){const m=(t||'').toUpperCase().match(/[23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,3}/);return m?m[0]:null}
function olcRecover(code,refLat,refLng){
 const sep=code.indexOf('+');if(sep<0)return null;
 const ref=olcEncode(refLat,refLng,10);
 return olcDecode(ref.substring(0,sep)+code.replace(/[+]/g,''));
}
function handleOlc(text,cb){
 const code=olcFromText(text);
 if(!code)return false;
 const apply=(p,note)=>{if(!p)return alert('كود غير صحيح');cb({lat:p.latC,lng:p.lngC},note)};
 if(code.indexOf('+')===8){apply(olcDecode(code));return true}
 const fb=()=>{const p=olcRecover(code,30.05,31.21);if(p)cb({lat:p.latC,lng:p.lngC},'تقريبي');else alert('كود غير صحيح')};
 if(!navigator.geolocation){fb();return true}
 navigator.geolocation.getCurrentPosition(p=>apply(olcRecover(code,p.coords.latitude,p.coords.longitude)),
  fb,{timeout:6000});
 return true;
}

/* ---------- لصق موقع مرسل واستخراج الإحداثيات ---------- */
function parseLoc(t){
 t=(t||'').replace(/،/g,',').replace(/٫/g,'.').trim();
 t=t.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
 const dms=t.match(/(\d{1,2})\s*°\s*(\d{1,2})\s*['\u2032]\s*([\d.]+)\s*["\u2033]?\s*([NnSsشج])[^0-9]+(\d{1,3})\s*°\s*(\d{1,2})\s*['\u2032]\s*([\d.]+)\s*["\u2033]?\s*([EeWwقغ])/);
 if(dms){let la=+dms[1]+(+dms[2])/60+(+dms[3])/3600;let ln=+dms[5]+(+dms[6])/60+(+dms[7])/3600;
  if(/s|ج/i.test(dms[4]))la=-la;if(/w|غ/i.test(dms[8]))ln=-ln;return{lat:la,lng:ln}}
 const dms2=t.match(/([NnSsشج])\s*(\d{1,2})\s*°\s*(\d{1,2})\s*['\u2032]\s*([\d.]+)\s*["\u2033]?[^0-9]+([EeWwقغ])\s*(\d{1,3})\s*°\s*(\d{1,2})\s*['\u2032]\s*([\d.]+)\s*["\u2033]?/);
 if(dms2){let la=+dms2[2]+(+dms2[3])/60+(+dms2[4])/3600;let ln=+dms2[6]+(+dms2[7])/60+(+dms2[8])/3600;
  if(/s|ج/i.test(dms2[1]))la=-la;if(/w|غ/i.test(dms2[5]))ln=-ln;return{lat:la,lng:ln}}
 let m=t.match(/[?&]q=(-?\d+\.\d+)\s*[,\s]\s*(-?\d+\.\d+)/i)
  ||t.match(/@(-?\d+\.\d+)\s*[,\s]\s*(-?\d+\.\d+)/)
  ||t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/i)
  ||t.match(/\b3d(-?\d+\.\d+)\D+4d(-?\d+\.\d+)/i)
  ||t.match(/(-?\d{1,2}\.\d{4,})\s*[,\s]\s*(-?\d{1,3}\.\d{4,})/);
 return m?{lat:+m[1],lng:+m[2]}:null;
}
function fillCoords(p,note){
 document.querySelector('#dlg [name=lat]').value=p.lat.toFixed(6);
 document.querySelector('#dlg [name=lng]').value=p.lng.toFixed(6);
 if(confirm('تم استخراج الموقع ✔'+(note?' ('+note+')':'')+'\nخط العرض: '+p.lat.toFixed(6)+'\nخط الطول: '+p.lng.toFixed(6)+'\n\nتريد فتح الخريطة للتأكد؟'))
  window.open('https://maps.google.com/?q='+p.lat+','+p.lng);
}
function getLocNow(){
 if(!navigator.geolocation)return alert('جهازك لا يدعم تحديد الموقع');
 navigator.geolocation.getCurrentPosition(p=>fillCoords({lat:p.coords.latitude,lng:p.coords.longitude}),
  ()=>alert('تعذر تحديد الموقع.\n\nفعّل الـ GPS واسمح للمتصفح من إعدادات الموقع.'));
}
function togPaste(){

 w.style.display=w.style.display==='none'?'block':'none';
 if(navigator.clipboard&&navigator.clipboard.readText)
  navigator.clipboard.readText().then(t=>{const b=$('#pasteBox');if(t&&b&&!b.value)b.value=t}).catch(()=>{});
}
function doPaste(){
 const t=($('#pasteBox')?.value||'').trim();
 if(!t)return alert('الصق النص الأول في الخانة اللي فوق');
 const done=handleOlc(t,fillCoords)||(()=>{const p=parseLoc(t);if(p){fillCoords(p);return true}return false})();
 if(!done)alert('لم أستطع استخراج الموقع من هذا النص.\n\nاللي كتبته:\n'+t+'\n\nأقبل: رابط خرائط طويل فيه أرقام، أو إحداثيات زي 30.123456, 31.456789، أو Plus Code كامل.');
}

function clearFieldData(k,fk){

 DB.data[k].forEach(r=>{
  if(fk==='_map'){delete r.lat;delete r.lng}
  else delete r[fk];
 });

 save();alert('✅ تم مسح كل قيم «'+l+'»');lblList();

function saveLbl(k,fk){
 DB.labels[k]=DB.labels[k]||{};
 const v=($('#lb_'+fk)&&$('#lb_'+fk).value||'').trim();
 if(!v)return alert('اكتب الاسم');
 if(isExtra(k,fk)&&v!==fk){
  if((DB.extra[k]||[]).includes(v))return alert('الاسم موجود');
  DB.extra[k]=DB.extra[k].map(x=>x===fk?v:x);
  DB.data[k].forEach(r=>{if(r._x&&fk in r._x){r._x[v]=r._x[fk];delete r._x[fk]}});
  delete DB.labels[k][fk];DB.labels[k][v]=v;
  save();alert('✅ تمت إعادة التسمية ونقل البيانات');lblList();return;
 }
 const orig=(ENT[k].f.find(x=>x[0]===fk)||[])[1]||SPECIAL_LABELS[fk]||fk;
 if(v&&v!==orig)DB.labels[k][fk]=v;else delete DB.labels[k][fk];
 save();alert('تم حفظ العنوان');
}

/* ---------- دمج بيانات الاستمارات الواردة (بدون فقدان الحالي) ---------- */
function mergeIncoming(inc){
 const src=inc.data?inc.data:(inc.entries?{sites:inc.entries}:null);
 if(!src)return alert('ملف/نص غير معروف — المطلوب بيانات من استمارة الجمع');
 let added=0,dup=0;
 EKEYS.forEach(k=>{
  (src[k]||[]).forEach(rec=>{
   const firstF=ENT[k].f[0][0];
   const key=rec[firstF];
   if(key&&DB.data[k].some(x=>x[firstF]===key)){dup++;return}
   const {id,...rest}=rec;

/* ---------- محرك PDF: رسم يدوي على Canvas + jsPDF ---------- */
function wrapText(c,text,maxW){
 const words=String(text??'').split(/\s+/).filter(x=>x!=='');const lines=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;
  if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
 if(cur)lines.push(cur);
 return lines.length?lines:[''];
}
async function renderPdfPages(k,rows,only){
 let F=orderedFields(k);if(only&&only.length)F=F.filter(f=>only.includes(f[0]));
 const W=1122,H=793,M=34,S=2;
 const img=new Image();img.src=LOGO_SRC;
 try{await img.decode()}catch(e){}
 // عرض الأعمدة

 const avail=W-2*M-36;

  rows.forEach(r=>{const v=f[0]==='_map'?(r.lat?r.lat+', '+r.lng:''):r[f[0]];if(v)L=Math.max(L,String(v).length)});
  return L});
 let ws=lens.map((L,fi)=>Math.max(fi===0?130:56,Math.min(190,L*6.4+16)));
 const sum=ws.reduce((a,b)=>a+b,0);
 ws=ws.map(w=>w*avail/sum);
 const pages=[];let cv,c,y,pageRows;
 function newPage(){
  cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;
  c=cv.getContext('2d');c.scale(S,S);
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);

  c.textAlign='right';
  c.fillStyle='#000';c.font='bold 14.5px Tahoma, Arial';
  c.fillText('الشركة القابضة لمياه الشرب والصرف الصحى',W-M,M+9);
  c.font='12.5px Tahoma, Arial';
  c.fillText('شركة مياه الشرب والصرف الصحي بالجيزة',W-M,M+26);
  c.font='bold 13px Tahoma, Arial';
  c.fillText('(الإدارة العامة للأمن)',W-M,M+43);
  // خط فاصل
  c.strokeStyle='#333';c.lineWidth=1.2;
  c.beginPath();c.moveTo(M,M+56);c.lineTo(W-M,M+56);c.stroke();
  // العنوان
  c.textAlign='center';c.font='bold 16px Tahoma, Arial';
  c.fillText('(حصر اعداد الكاميرات)',W/2,M+78);
  y=M+96;
  pageRows=[];
 }
 function cellText(text,x,w,align,bold,color,size){
  c.font=(bold?'bold ':'')+(size||11)+'px Tahoma, Arial';
  c.fillStyle=color||'#111';
  c.textAlign=align;
  const lines=wrapText(c,text,w-10);
  const lh=(size||11)+4.5;
  lines.forEach((ln,i)=>c.fillText(ln, align==='right'?x+w-6:align==='center'?x+w/2:x+6, y+12+i*lh));
  return lines.length*lh+8;
 }
 function headerRow(){
  const hs=F.map((f,fi)=>{c.font='bold 11px Tahoma, Arial';
   return wrapText(c,f[1],ws[fi]-10).length*15.5+12});
  const hh=Math.max(30,...hs);
  const R=W-M;
  c.fillStyle='#c8d8ea';c.fillRect(M,y,W-2*M,hh);
  c.strokeStyle='#5d7086';c.lineWidth=1.1;c.strokeRect(M,y,W-2*M,hh);
  c.fillStyle='#b3c7dd';c.fillRect(R-36,y,36,hh);

  cellText('م',R-36,36,'center',true,'#16324f',11);

   cellText(f[1],x,cw,'center',true,'#16324f',11);

 }
 function dataRow(r,idx,tint){

   c.strokeStyle='#8fa2b5';c.beginPath();c.moveTo(x,y);c.lineTo(x,y+rh);c.stroke();

 function totalsRow(){

 }
 newPage();headerRow();
 rows.forEach((r,idx)=>{

async function makePdfBlob(k,btn,only){
 const kw=(listView.kw||'');
 let rows=(listView.dispEnt===k&&listView.dispRows)?listView.dispRows.filter(r=>!kw||JSON.stringify(r).includes(kw)).slice():DB.data[k].filter(r=>!kw||JSON.stringify(r).includes(kw));
 if(k==='sites'&&listView.sec)rows=rows.filter(r=>(r.sector||'بدون قطاع')===listView.sec);
 if(!rows.length){alert('لا توجد بيانات');return null}
 if(btn){btn.innerHTML='⏳';btn.disabled=true}
 try{
  const pages=await renderPdfPages(k,rows,only);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'px',format:[1122,793],orientation:'landscape',hotfixes:['px_scaling'],compress:true});
  pages.forEach((d,idx)=>{if(idx>0)doc.addPage([1122,793],'landscape');doc.addImage(d,'JPEG',0,0,1122,793,undefined,'FAST')});
  return doc.output('blob');
 }catch(e){alert('تعذر إنشاء PDF: '+(e&&e.message||e));return null}
 finally{if(btn)btn.disabled=false}
}

async function sharePdf(k,btn,only){
 if(!btn)btn=event&&event.target;
 const old=btn?btn.innerHTML:'';
 if(btn){btn.textContent='⏳';btn.disabled=true}
 const ok=await loadPdfLib();
 if(!ok){if(btn){btn.disabled=false;btn.innerHTML=old}alert('تعذر تحميل مكتبة PDF — تأكد من تشغيل البيانات');return}
 const blob=await makePdfBlob(k,null,only);
 if(btn){btn.disabled=false;btn.innerHTML=old}
 if(!blob){if(btn)btn.disabled=false;return}
 const file=new File([blob],'حصر كاميرات.pdf',{type:'application/pdf'});
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]}))
   await navigator.share({files:[file],title:'حصر كاميرات الأمن'});
  else saveBlob(blob);
 }catch(e){
  if(e&&e.name!=='AbortError')saveBlob(blob);
 }
 if(btn)btn.disabled=false;
}
function saveBlob(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='حصر كاميرات.pdf';a.click()}

/* ---------- ترتيب الأعمدة ---------- */
function orderedFields(k){
 const F=ENT[k].f;
 const o=(DB.fieldOrder||{})[k];
 if(!o)return F;
 const map={};F.forEach(f=>map[f[0]]=f);
 const out=o.map(key=>map[key]).filter(Boolean);
 F.forEach(f=>{if(!o.includes(f[0]))out.push(f)});
 return out;
}
function moveField(k,fk,dir){
 const cur=orderedFields(k).map(f=>f[0]);
 const i=cur.indexOf(fk);const j=i+dir;
 if(i<0||j<0||j>=cur.length)return;
 [cur[i],cur[j]]=[cur[j],cur[i]];
 DB.fieldOrder=DB.fieldOrder||{};DB.fieldOrder[k]=cur;
 save();lblList();
}

/* ---------- سحب وإفلات صفوف العناوين ---------- */
let dragFk=null;
function rowDragStart(k,fk){dragFk=fk}
function rowDragOver(ev,el){ev.preventDefault();el.style.background='#dbe7f3'}
function rowDragLeave(el){el.style.background=''}
function rowDrop(k,targetFk,el){
 el.style.background='';
 if(!dragFk||dragFk===targetFk){dragFk=null;return}
 const cur=orderedFields(k).map(f=>f[0]);
 const from=cur.indexOf(dragFk), to=cur.indexOf(targetFk);
 if(from<0||to<0){dragFk=null;return}
 cur.splice(to,0,cur.splice(from,1)[0]);
 DB.fieldOrder=DB.fieldOrder||{};DB.fieldOrder[k]=cur;
 dragFk=null;
 save();lblList();
}

function addF(){
 const k=($('#ek')&&$('#ek').value)||'sites';
 const f=($('#ef')&&$('#ef').value||'').trim();
 if(!f)return;
 DB.extra[k]=DB.extra[k]||[];
 if(DB.extra[k].includes(f))return alert('الخانة موجودة');
 DB.extra[k].push(f);
 if(DB.labels[k]&&DB.labels[k][f]===undefined)DB.labels[k][f]=f;
 save();
 audit('إضافة خانة',ENT[k].t,f);
 if($('#ef'))$('#ef').value='';
 showFList();
 if(($('#lk')&&$('#lk').value)===k)lblList();
 alert('✅ اتضافت «'+f+'» — شوفها في تعديل العناوين');
}
function showFList(){
 const box=$('#flist');
 if(!box)return;
 const k=($('#ek')&&$('#ek').value)||'sites';
 const list=DB.extra[k]||[];
 box.innerHTML=`<div class="tbl-wrap" style="max-height:200px"><table>
 <tr><th>م</th><th>الخانة</th><th>إجراءات</th></tr>
 ${list.map((f,i)=>`<tr><td>${i+1}</td><td style="text-align:right;font-weight:bold">${f}</td>
 <td style="white-space:nowrap"><button class="btn btn3" style="padding:5px 10px" onclick="delF('${k}','${jsQ(f)}')">🗑</button></td></tr>`).join('')||'<tr><td colspan="3" style="text-align:center;color:#888">لا خانات إضافية</td></tr>'}
 </table></div>`;
}
function delF(k,f){
 if(!confirm('🗑 حذف خانة «'+f+'»؟\n\nهتمسح قيمها من كل السجلات'))return;
 DB.extra[k]=(DB.extra[k]||[]).filter(x=>x!==f);
 DB.data[k].forEach(r=>{if(r._x)delete r._x[f]});
 delete (DB.labels[k]||{})[f];
 audit('حذف خانة',ENT[k].t,f);
 save();lblList();showFList();
}
function backup(){dl('نسخة_احتياطية_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(DB),'application/json')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{
  if(!confirm('استبدال البيانات الحالية بالنسخة المنقولة؟'))return;
  const inc=JSON.parse(e.target.result);
  DB={data:inc.data||{},extra:inc.extra||{},labels:inc.labels||{},roles:DB.roles||{},seq:inc.seq||1000,att:DB.att||{}};
  EKEYS.forEach(k=>{if(!DB.data[k])DB.data[k]=[]});
  save();
  alert('✅ تم النقل والمزامنة مع السحابة');
  mainView();
 }catch(err){alert('ملف تالف')}};r.readAsText(f)}

save();
