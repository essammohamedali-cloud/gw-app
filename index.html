<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4e7e">
<title>نظام أمن المحطات — مياه الجيزة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f4f6f9;color:#222}
header{background:#1d4e7e;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:9}
header img{width:36px;height:36px;border-radius:50%;background:#fff}
header b{font-size:15px}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #c8d2e0;position:sticky;top:56px;z-index:8}
nav button{flex:0 0 auto;padding:11px 14px;border:none;background:#fff;color:#33475b;font-size:13px;border-bottom:3px solid transparent}
nav button.on{color:#1d4e7e;border-bottom-color:#1d4e7e;font-weight:bold}
main{padding:12px}
.card{background:#fff;border:1px solid #c8d2e0;border-radius:10px;padding:12px;margin-bottom:12px}
input,select,textarea{width:100%;padding:9px;border:1px solid #c8d2e0;border-radius:8px;font-size:14px;margin-bottom:8px}
textarea{min-height:70px}
label{font-size:12px;color:#33475b;display:block;margin-bottom:3px}
.btn{background:#1d4e7e;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn2{background:#e6ecf4;color:#1d4e7e}
.btn3{background:#c0392b}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
th{background:#1d4e7e;color:#fff;padding:7px 5px;position:sticky;top:0}
td{padding:7px 5px;border-bottom:1px solid #dde5ee;text-align:center}
tr:nth-child(even){background:#f0f4f9}
.tbl-wrap{overflow-x:auto;max-height:60vh;overflow-y:auto;border:1px solid #c8d2e0;border-radius:10px}
dialog{border:none;border-radius:14px;padding:0;width:94%;max-width:480px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.mhead{background:#1d4e7e;color:#fff;padding:12px;font-weight:bold;border-radius:14px 14px 0 0}
.mbody{padding:14px}
.chip{display:inline-block;background:#e6ecf4;color:#1d4e7e;border-radius:12px;padding:2px 10px;font-size:12px;margin:2px}
.item{border:1px solid #dde5ee;border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.item b{color:#1d4e7e}
.muted{color:#888;font-size:12px}
</style>
</head>

function saveRec(k,id){
 // تنبيه تكرار اسم المحطة

/* ---------- فك شيفرة Plus Code (كود الموقع المختصر) ---------- */
const OLCA='23456789CFGHJMPQRVWX';
function olcEncode(lat,lng,codeLen){
 lat=Math.min(90,Math.max(-90,lat));lng=((lng+180)%360+360)%360-180;
 let latv=lat+90,lngv=lng+180,lp=20,gp=20,code='',d=0;
 while(d<codeLen){
  if(d===8)code+='+';
  if(d<10){code+=OLCA[Math.floor(latv/lp)];latv%=lp;lp/=20;code+=OLCA[Math.floor(lngv/gp)];lngv%=gp;gp/=20;d+=2}
  else{lp/=5;gp/=4;const r=Math.floor(latv/lp),c=Math.floor(lngv/gp);code+=OLCA[r*4+c];latv-=r*lp;lngv-=c*gp;d++}
 }
 return code;
}
function olcDecode(code){
 code=code.toUpperCase().replace(/[+]/g,'').replace(/0+$/,'');
 if(code.length<2)return null;
 let lat=0,lng=0,lp=20,gp=20,d=0;
 for(;d<Math.min(code.length,10);d++){const i=OLCA.indexOf(code[d]);if(i<0)return null;
  if(d%2===0){lat+=i*lp;lp/=20}else{lng+=i*gp;gp/=20}}
 let lr=lp,gr=gp;
 for(;d<code.length;d++){const i=OLCA.indexOf(code[d]);if(i<0)return null;
  lr/=5;gr/=4;lat+=Math.floor(i/4)*lr;lng+=(i%4)*gr}
 return{latC:lat-90+lr/2,lngC:lng-180+gr/2};
}
function olcFromText(t){const m=(t||'').toUpperCase().match(/[23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,3}/);return m?m[0]:null}
function olcRecover(code,refLat,refLng){
 const sep=code.indexOf('+');if(sep<0)return null;
 const ref=olcEncode(refLat,refLng,10);
 return olcDecode(ref.substring(0,sep)+code.replace(/[+]/g,''));
}
function handleOlc(text,cb){
 const code=olcFromText(text);
 if(!code)return false;
 const apply=p=>{if(!p)return alert('كود غير صحيح');cb({lat:p.latC,lng:p.lngC})};
 if(code.indexOf('+')===8){apply(olcDecode(code));return true}
 if(!navigator.geolocation)return alert('الكود ده مختصر (زي 44FR+XF8) ومحتاج يعرف مكانك عشان يكمل الأرقام الناقصة.\n\nفعّل الـ GPS واسمح للمتصفح يستخدم الموقع، وبعدين جرب تاني.'),true;
 navigator.geolocation.getCurrentPosition(p=>apply(olcRecover(code,p.coords.latitude,p.coords.longitude)),
  ()=>alert('تعذر الوصول لموقعك.\n\nافتح إعدادات الموبايل ← المتصفح ← الموقع ← اسمح،\nأو استخدم رابط خرائط طويل فيه الأرقام مباشرة.'));
 return true;
}

/* ---------- لصق موقع مرسل واستخراج الإحداثيات ---------- */
function parseLoc(t){
 t=(t||'').replace(/،/g,',').replace(/٫/g,'.').trim(); // فواصل عربية وأرقام عربية
 t=t.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); // تحويل الأرقام العربية للإنجليزية
 let m=t.match(/[?&]q=(-?\d+\.\d+)\s*[,\s]\s*(-?\d+\.\d+)/i)
  ||t.match(/@(-?\d+\.\d+)\s*[,\s]\s*(-?\d+\.\d+)/)
  ||t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/i)
  ||t.match(/\b3d(-?\d+\.\d+)\D+4d(-?\d+\.\d+)/i)
  ||t.match(/(-?\d{1,2}\.\d{4,})\s*[,\s]\s*(-?\d{1,3}\.\d{4,})/);
 return m?{lat:+m[1],lng:+m[2]}:null;
}
function fillCoords(p){
 document.querySelector('#dlg [name=lat]').value=p.lat.toFixed(6);
 document.querySelector('#dlg [name=lng]').value=p.lng.toFixed(6);
 if(confirm('تم استخراج الموقع ✔\nخط العرض: '+p.lat.toFixed(6)+'\nخط الطول: '+p.lng.toFixed(6)+'\n\nتريد فتح الخريطة للتأكد؟'))
  window.open('https://maps.google.com/?q='+p.lat+','+p.lng);
}
function getLocNow(){
 if(!navigator.geolocation)return alert('جهازك لا يدعم تحديد الموقع');
 navigator.geolocation.getCurrentPosition(p=>fillCoords({lat:p.coords.latitude,lng:p.coords.longitude}),
  ()=>alert('تعذر تحديد الموقع.\n\nفعّل الـ GPS واسمح للمتصفح من إعدادات الموقع.'));
}
function togPaste(){
 const w=$('#pasteWrap');if(!w)return;
 w.style.display=w.style.display==='none'?'block':'none';
 if(navigator.clipboard&&navigator.clipboard.readText)
  navigator.clipboard.readText().then(t=>{const b=$('#pasteBox');if(t&&b&&!b.value)b.value=t}).catch(()=>{});
}
function doPaste(){
 const t=($('#pasteBox')?.value||'').trim();
 if(!t)return alert('الصق النص الأول في الخانة اللي فوق');
 const done=handleOlc(t,fillCoords)||(()=>{const p=parseLoc(t);if(p){fillCoords(p);return true}return false})();
 if(!done)alert('لم أستطع استخراج الموقع من هذا النص.\n\nاللي كتبته:\n'+t+'\n\nأقبل: رابط خرائط طويل فيه أرقام، أو إحداثيات زي 30.123456, 31.456789، أو Plus Code كامل.');

/* ---------- دمج بيانات الاستمارات الواردة (بدون فقدان الحالي) ---------- */
function mergeIncoming(inc){
 const src=inc.data?inc.data:(inc.entries?{sites:inc.entries}:null);
 if(!src)return alert('ملف/نص غير معروف — المطلوب بيانات من استمارة الجمع');
 let added=0,dup=0;
 EKEYS.forEach(k=>{
  (src[k]||[]).forEach(rec=>{
   const firstF=ENT[k].f[0][0];
   const key=rec[firstF];
   if(key&&DB.data[k].some(x=>x[firstF]===key)){dup++;return}
   const {id,...rest}=rec;
   DB.data[k].push({...rest,id:DB.seq++});added++;
  });
 });
 if(inc.extra)for(const k in inc.extra){DB.extra[k]=[...new Set([...(DB.extra[k]||[]),...inc.extra[k]])]}
 if(inc.labels)for(const k in inc.labels){DB.labels[k]=DB.labels[k]||{};for(const f2 in inc.labels[k])DB.labels[k][f2]=inc.labels[k][f2]}
 save();
 alert('✅ تم الدمج بنجاح!\nسجلات جديدة أُضيفت: '+added+'\nمكررة تم تخطيها: '+dup);
 mainView();
}
function restoreMerge(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=e=>{try{mergeIncoming(JSON.parse(e.target.result))}catch(err){alert('ملف تالف أو غير مطابق')}};
 r.readAsText(f);
}

 <p class="muted" style="margin-bottom:8px">غيّر اسم أي حقل وهيتحفظ في كل الشاشات والتقارير والتصدير</p>
 <div class="row"><select id="lk" style="flex:1" onchange="lblList()">${EKEYS.map(k=>`<option value="${k}">${ENT[k].t}</option>`).join('')}</select></div>
 <div id="lblEd"></div></div>
 <div class="card"><h3 style="color:#1d4e7e;margin-bottom:8px">💾 النسخ الاحتياطي</h3>
 <div class="row"><button class="btn" onclick="backup()">⬇️ تصدير نسخة احتياطية</button>
 <label class="btn btn2" style="text-align:center">⬆️ استعادة نسخة<input type="file" accept=".json" hidden onchange="restore(this)"></label>
 <label class="btn" style="text-align:center;background:#1d7e4e">📥 دمج بيانات واردة<input type="file" accept=".json" hidden onchange="restoreMerge(this)"></label>
 <button class="btn" style="background:#8e44ad;margin-top:6px" onclick="mergeTextDlg()">📋 دمج من نص واتساب (لصق)</button></div>
 <button class="btn btn3" style="width:100%;margin-top:8px" onclick="if(confirm('تسجيل الخروج؟'))AUTH.signOut()">🚪 تسجيل الخروج</button></div>`;
 showFList();lblList();
}
function addF(){const k=$('#ek').value,f=$('#ef').value.trim();if(!f)return;
 DB.extra[k]=DB.extra[k]||[];if(!DB.extra[k].includes(f)){DB.extra[k].push(f);save()}showFList()}
function showFList(){const k=$('#ek').value;$('#flist').innerHTML=(DB.extra[k]||[]).map(f=>`<span class="chip">${f} <a href="#" onclick="DB.extra['${k}']=DB.extra['${k}'].filter(x=>x!=='${f}');save();showFList();return false">✖</a></span>`).join('')||'<p class="muted">لا خانات إضافية</p>'}
function backup(){dl('نسخة_احتياطية_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(DB),'application/json')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{
  if(!confirm('استبدال البيانات الحالية بالنسخة المنقولة؟'))return;
  const inc=JSON.parse(e.target.result);
  DB={data:inc.data||{},extra:inc.extra||{},labels:inc.labels||{},roles:DB.roles||{},seq:inc.seq||1000,att:DB.att||{}};
  EKEYS.forEach(k=>{if(!DB.data[k])DB.data[k]=[]});
  save();
  alert('✅ تم النقل والمزامنة مع السحابة');
  mainView();
 }catch(err){alert('ملف تالف')}};r.readAsText(f)}

save();

</script>
</body></html>
