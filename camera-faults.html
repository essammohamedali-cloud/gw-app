*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif}body{background:#f4f7fb;color:#222;min-height:100vh;padding-bottom:22px}header{background:#1d4e7e;color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px}header img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:12px;padding:3px;flex:none}header .hCenter{flex:1;text-align:center;line-height:1.7}header .hCenter h1{font-size:17px;font-weight:900}header .hCenter p{font-size:10px;color:#dbe9f7}main{max-width:760px;margin:0 auto;padding:0;width:100%}.card{background:#fff;border-radius:0;padding:12px 14px;box-shadow:none;border:none;min-height:calc(100vh - 64px)}@media(min-width:761px){.card{border-radius:16px;box-shadow:0 6px 18px rgba(20,40,70,.09);border:1px solid #e4eaf2;margin:8px auto}}#previewWrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.prevItem{position:relative;width:84px;height:84px;flex:none}.prevItem img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1.5px solid #dbe3ec;display:block}.prevItem .remove{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;background:#c0392b;color:#fff;font-size:12px;font-weight:900;line-height:1;padding:0;cursor:pointer;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}label{display:block;font-size:12px;color:#33475b;font-weight:800;margin:5px 0 3px}input,select,textarea{width:100%;border:1.5px solid #d8e1ec;border-radius:10px;padding:8px 10px;font-size:14px;background:#fff}input:focus,select:focus,textarea:focus{outline:none;border-color:#1d4e7e;box-shadow:0 0 0 3px rgba(29,78,126,.13)}textarea{min-height:64px;resize:vertical}button{border:none;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;font-size:14px}.btn-wa{background:#25D366;color:#fff;width:100%;margin-top:10px;box-shadow:0 4px 12px rgba(18,140,75,.22)}.fileBtn{display:flex;align-items:center;justify-content:center;gap:6px;background:#eef4fb;color:#1d4e7e;border:1.5px dashed #8fb2d6;border-radius:10px;padding:8px;cursor:pointer;font-weight:900}.fileBtn input{display:none}#preview{max-width:100%;max-height:90px;border-radius:10px;margin-top:5px;display:none;border:1.5px solid #dbe3ec}.note{font-size:11px;color:#7b8794;margin-top:4px}#status{display:none;margin-top:8px;padding:8px;border-radius:10px;font-weight:800;text-align:center}.ok{background:#e8f7ee;color:#1d7e4e;border:1px solid #a8dfbd}.err{background:#fdecea;color:#c0392b;border:1px solid #f1b0aa}.suggBox{position:relative}#sugg{position:absolute;top:100%;right:0;left:0;background:#fff;border:1.5px solid #1d4e7e;border-top:none;border-radius:0 0 12px 12px;z-index:40;max-height:230px;overflow:auto;display:none;box-shadow:0 8px 18px rgba(0,0,0,.13)}#sugg div{padding:11px 12px;border-bottom:1px solid #edf1f5;cursor:pointer;font-size:14px}#sugg div:hover{background:#eef4fb}.noimg{display:flex!important;flex-direction:row;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-size:12px;color:#33475b;font-weight:900;direction:rtl;text-align:center}.noimg input{width:18px;height:18px;flex:none;margin:0}.sig{position:fixed;bottom:8px;left:12px;z-index:40;font-size:12px;color:#667;font-weight:700;direction:ltr}

const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzplAO-psVGpkokCpsCsrwl5_LfRAnNPk9xBrh269DxLrDAvUOhkZz9sJlmkj-ll03O/exec';
const MAX_PHOTOS=10;
let cardFiles=[];
function status(t,ok){const s=document.getElementById('status');s.className=ok?'ok':'err';s.textContent=t;s.style.display='block'}
function updateSugg(){const inp=document.getElementById('site'),box=document.getElementById('sugg'),sec=document.getElementById('sector').value,q=inp.value.trim();box.innerHTML='';if(q.length<2){box.style.display='none';return}const hits=SITES.filter(x=>(!sec||x.sector===sec)&&x.name.indexOf(q)>=0).slice(0,100);if(!hits.length){box.style.display='none';return}box.innerHTML=hits.map(x=>'<div data-name="'+x.name.replace(/"/g,'&quot;')+'" onclick="pickSite(this)">'+x.name+'</div>').join('');box.style.display='block'}
function pickSite(el){document.getElementById('site').value=el.dataset.name;document.getElementById('sugg').style.display='none'}
document.getElementById('sector').addEventListener('change',updateSugg);document.getElementById('site').addEventListener('input',updateSugg);
function renderPreviews(){const w=document.getElementById('previewWrap');w.innerHTML='';if(cardFiles.length>=MAX_PHOTOS)status('ℹ️ الحد الأقصى '+MAX_PHOTOS+' صور',true);cardFiles.forEach((f,i)=>{const d=document.createElement('div');d.className='prevItem';const img=document.createElement('img');img.src=f.url;img.alt='صورة '+(i+1);const x=document.createElement('button');x.type='button';x.className='remove';x.title='حذف الصورة';x.textContent='✕';x.onclick=()=>{URL.revokeObjectURL(f.url);cardFiles.splice(i,1);renderPreviews()};d.appendChild(img);d.appendChild(x);w.appendChild(d)})}
function compressImage(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{const max=1200,sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cv.toBlob(blob=>{if(!blob)return rej(new Error('compress'));res(new File([blob],'kart-zeyara-'+Date.now()+'.jpg',{type:'image/jpeg'}))},'image/jpeg',.82)};img.onerror=rej;img.src=e.target.result};rd.onerror=rej;rd.readAsDataURL(file)})}
document.getElementById('card').addEventListener('change',async function(){const files=Array.from(this.files||[]);this.value='';if(!files.length)return;for(const f of files){try{const cf=await compressImage(f);cardFiles.push({file:cf,url:URL.createObjectURL(cf)})}catch(e){console.error(e)}}renderPreviews()});
document.getElementById('noImage').addEventListener('change',function(){const inp=document.getElementById('card');if(this.checked){inp.value='';cardFiles.forEach(f=>URL.revokeObjectURL(f.url));cardFiles=[];renderPreviews();inp.disabled=true}else{inp.disabled=false}});
function successCloseFaultForm(){status('✅ تم ارسال العطل بنجاح سيتم الحل فى اقرب وقت',true);resetFaultForm();setTimeout(()=>{try{window.close()}catch(e){}},2500)}
function resetFaultForm(){try{document.getElementById('waFaultForm').reset();const inp=document.getElementById('card');inp.disabled=false;cardFiles.forEach(f=>URL.revokeObjectURL(f.url));cardFiles=[];document.getElementById('previewWrap').innerHTML='';const sg=document.getElementById('sugg');if(sg)sg.style.display='none'}catch(e){}}
function toBase64(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=e=>res(e.target.result.split(',')[1]);rd.onerror=rej;rd.readAsDataURL(file)})}
async function postToServer(msg,files){
 const images=[];for(const f of files.slice(0,MAX_PHOTOS)){images.push({name:f.name,data:await toBase64(f)})}
 const body=JSON.stringify({msg:msg,images:images});
 let resp=null;
 try{resp=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:body});}
 catch(err){try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:body});return null;}catch(e2){throw err;}}
 let out=null;try{out=await resp.json()}catch(e){}
 if(out&&out.ok===false)throw new Error(out.error||'server-error');
 return out;
}
document.getElementById('waFaultForm').addEventListener('submit',async e=>{e.preventDefault();const sector=document.getElementById('sector').value,site=document.getElementById('site').value.trim(),officer=document.getElementById('officer').value.trim(),org=document.getElementById('org').value.trim(),fault=document.getElementById('fault').value.trim(),noImage=document.getElementById('noImage').checked;if(!site||!fault)return status('❌ اكتب اسم المحطة ووصف العطل',false);if(!noImage&&!cardFiles.length)return status('❌ أرفق صورة واحدة على الأقل أو اضغط بدون صورة',false);status('⏳ جاري الإرسال...',true);const msg=['🚨 بلاغ عطل جديد','🏢 رقم المؤسسة: '+org,'🗂️ القطاع: '+sector,'🏠 المحطة: '+site,'👮 مسؤول الأمن: '+officer,'🔧 العطل: '+fault,'📷 عدد الصور: '+(noImage?'بدون صورة':cardFiles.length),'🕒 التوقيت: '+new Date().toLocaleString('ar-EG')].join('\n');try{const out=await postToServer(msg,noImage?[]:cardFiles.map(f=>f.file));
   if(out===null){status('✅ تم الإرسال — تأكد إنه وصل تيليجرام',true);resetFaultForm()}
   else successCloseFaultForm();
  }catch(err){console.error(err);const m=String(err&&err.message||'');status(m&&m!=='server-error'&&m!=='server'?'❌ خطأ: '+m.slice(0,150):'❌ حدث خطأ أثناء الإرسال، حاول تاني',false)}});
</script>
